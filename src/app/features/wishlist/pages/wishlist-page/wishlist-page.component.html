<section class="page">
  <h1>Mi Wishlist</h1>

  <div *ngIf="successMessage" class="state state--success">
    {{ successMessage }}
  </div>

  <div *ngIf="loading" class="state state--loading">
    Cargando tu wishlist...
  </div>

  <div *ngIf="!loading && errorMessage" class="state state--error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage && items.length === 0" class="state state--empty">
    Tu wishlist está vacía. Agrega productos desde el catálogo.
  </div>

  <div *ngIf="!loading && !errorMessage && items.length > 0" class="grid">
    <div class="card" *ngFor="let item of items">
      <div class="card__image">
        <img *ngIf="item.product?.image" [src]="item.product?.image" [alt]="item.product?.name" />
        <div *ngIf="!item.product?.image" class="card__no-image">Sin imagen</div>
      </div>
      <div class="card__body">
        <h3 class="card__title">{{ item.product?.name || 'Producto no disponible' }}</h3>
        <p class="card__price" *ngIf="item.product">${{ item.product.price }}</p>
        <div class="card__actions">
          <button
            *ngIf="item.product"
            class="btn btn--secondary"
            (click)="edit(item.product.id)"
          >
            Editar
          </button>
          <button class="btn btn--danger" (click)="remove(item.wishlist.id)">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</section>
