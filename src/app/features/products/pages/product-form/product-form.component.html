<section class="page">
  <h1>{{ isEditMode ? 'Editar producto' : 'Nuevo producto' }}</h1>

  <div *ngIf="loading" class="state state--loading">
    Cargando producto...
  </div>

  <form *ngIf="!loading" class="form" (ngSubmit)="save()">
    <label class="form__label">
      Nombre
      <input type="text" name="name" [(ngModel)]="formData.name" required />
    </label>

    <label class="form__label">
      Descripción
      <textarea name="description" [(ngModel)]="formData.description" rows="3"></textarea>
    </label>

    <label class="form__label">
      Categoría
      <input type="text" name="category" [(ngModel)]="formData.category" required />
    </label>

    <label class="form__label">
      Precio
      <input type="number" name="price" [(ngModel)]="formData.price" min="0" step="0.01" required />
    </label>

    <label class="form__label">
      Stock
      <input type="number" name="stock" [(ngModel)]="formData.stock" min="0" required />
    </label>

    <label class="form__label">
      URL de imagen (opcional)
      <input type="text" name="image" [(ngModel)]="formData.image" />
    </label>

    <div *ngIf="errorMessage" class="state state--error">
      {{ errorMessage }}
    </div>

    <div class="form__actions">
      <button type="submit" class="btn btn--primary" [disabled]="saving">
        {{ saving ? 'Guardando...' : (isEditMode ? 'Guardar cambios' : 'Crear producto') }}
      </button>
      <button type="button" class="btn btn--secondary" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</section>
